# image → check → build
# image：调用 toolchain-image.yml，按 Dockerfile 哈希标签判断，标签不存在时才构建；
#        输出的标签供 check/build 作为 container.image。
# check：所有 push / PR / 手动触发都在镜像容器内执行 packaging/check.sh。
# build：仅打 v* 标签时运行，编译、生成 SHA256SUMS、上传 artifact 并创建草稿 Release。
# 去重：分支推送的 run 先由 plan 检查当前 commit 是否已有 v* 标签，有则整套跳过，
#       交给标签 run 完整执行；标签 run 永远执行。详见 Doc/构建发布流程.md §8.1。
name: ci

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# 按 ref 分组：同一分支的新推送取消旧的分支 run；标签 run 的 ref 不同，
# 不会被分支 run 取消，且标签 run 自身从不 cancel-in-progress。
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref_type != 'tag' }}

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.plan.outputs.run }}
    steps:
      - uses: actions/checkout@v4
        if: github.event_name == 'push' && github.ref_type == 'branch'
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: 当前 commit 是否已有 v* 标签
        id: plan
        env:
          SHA: ${{ github.sha }}
          IS_BRANCH_PUSH: ${{ github.event_name == 'push' && github.ref_type == 'branch' }}
        run: |
          if [ "$IS_BRANCH_PUSH" != "true" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          if git tag --points-at "$SHA" | grep -q '^v'; then
            echo "本 commit 已有 v* 标签，交给标签 run"; echo "run=false" >> "$GITHUB_OUTPUT"; exit 0
          fi
          # 标签可能与分支同时推送而稍晚到达，等待并重试几次
          for _ in 1 2 3 4; do
            sleep 10
            # 轻量标签与附注标签（^{}）都匹配
            if git ls-remote --tags origin 'refs/tags/v*' | awk -v s="$SHA" '$1==s' | grep -q .; then
              echo "远端发现指向本 commit 的 v* 标签，交给标签 run"; echo "run=false" >> "$GITHUB_OUTPUT"; exit 0
            fi
          done
          echo "run=true" >> "$GITHUB_OUTPUT"

  image:
    needs: plan
    if: needs.plan.outputs.run == 'true'
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/toolchain-image.yml

  check:
    needs: [plan, image]
    if: needs.plan.outputs.run == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    container:
      image: ${{ needs.image.outputs.name }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - name: 与本地脚本一致的 /src 路径
        run: rm -rf /src && ln -s "$GITHUB_WORKSPACE" /src

      - uses: actions/cache@v4
        with:
          path: |
            /usr/local/cargo/registry
            /usr/local/cargo/git
            /opt/cargo-tools
            target
          key: check-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: check-${{ runner.os }}-

      - name: test / clippy / fmt / audit / deny
        run: bash packaging/check.sh

  build:
    needs: [plan, image, check]
    if: needs.plan.outputs.run == 'true' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: read
    container:
      image: ${{ needs.image.outputs.name }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - name: 与本地脚本一致的 /src 路径
        run: rm -rf /src && ln -s "$GITHUB_WORKSPACE" /src

      - uses: actions/cache@v4
        with:
          path: |
            /usr/local/cargo/registry
            /usr/local/cargo/git
            target
          key: build-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: build-${{ runner.os }}-

      - name: 编译 Linux 与 Windows（x86_64-pc-windows-gnu）
        run: bash packaging/compile.sh

      - name: SHA256SUMS
        run: |
          cd dist
          sha256sum Cross-SystemConnect-linux-x86_64.tar.gz Cross-SystemConnect-windows-x86_64.zip > SHA256SUMS

      - uses: actions/upload-artifact@v4
        with:
          name: cross-systemconnect-${{ github.ref_name }}
          path: |
            dist/Cross-SystemConnect-linux-x86_64.tar.gz
            dist/Cross-SystemConnect-windows-x86_64.zip
            dist/SHA256SUMS

      - name: 草稿 Release
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          generate_release_notes: true
          files: |
            dist/Cross-SystemConnect-linux-x86_64.tar.gz
            dist/Cross-SystemConnect-windows-x86_64.zip
            dist/SHA256SUMS
