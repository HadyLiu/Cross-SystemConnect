# check → build
# 容器使用已发布的 ghcr.io/hadyliu/cross-systemconnect-toolchain:latest。
# 本工作流不构建镜像；更新镜像时手动运行 toolchain-image.yml。
# check：分支 push、PR、手动触发在镜像容器内执行 packaging/check.sh。
#        推送 v* 标签时不跑 check，改为确认 master 上同一 commit 的 check 已通过。
# build：仅打 v* 标签时运行，编译、生成 SHA256SUMS、上传 artifact 并发布 Release。
name: ci

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# 按 ref 分组：同一分支的新推送取消旧的分支 run；标签 run 的 ref 不同，
# 不会被分支 run 取消，且标签 run 自身从不 cancel-in-progress。
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref_type != 'tag' }}

jobs:
  check:
    if: github.event_name != 'push' || github.ref_type != 'tag'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    container:
      image: ghcr.io/hadyliu/cross-systemconnect-toolchain:latest
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - name: 与本地脚本一致的 /src 路径
        run: rm -rf /src && ln -s "$GITHUB_WORKSPACE" /src

      - uses: actions/cache@v4
        with:
          path: |
            /usr/local/cargo/registry
            /usr/local/cargo/git
            /opt/cargo-tools
            target
          key: check-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: check-${{ runner.os }}-

      - name: test / clippy / fmt / audit / deny
        run: bash packaging/check.sh

  await-master-check:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    steps:
      - name: 等待 master 上同一 commit 的 check 通过
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.sha }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          echo "等待 master 上 $SHA 的 check 通过…"
          deadline=$((SECONDS + 2400))
          failed=0
          while [ "$SECONDS" -lt "$deadline" ]; do
            ids=$(gh run list --repo "$REPO" --workflow ci.yml --commit "$SHA" --branch master --event push --limit 20 --json databaseId --jq '.[].databaseId' || true)
            in_progress=0
            if [ -n "${ids:-}" ]; then
              for id in $ids; do
                result=$(gh run view "$id" --repo "$REPO" --json jobs --jq '.jobs[] | select(.name=="check") | [.status, (.conclusion // "")] | join(" ")')
                echo "run $id check: ${result:-<none>}"
                if echo "$result" | grep -qx 'completed success'; then
                  echo "master check 已通过 (run $id)"
                  exit 0
                fi
                if echo "$result" | grep -qx 'completed failure'; then
                  failed=1
                fi
                if echo "$result" | grep -Eq '^(queued|in_progress|waiting|pending|requested) '; then
                  in_progress=1
                fi
              done
            else
              echo "还没有 master 上的 CI run"
            fi
            if [ "$failed" = 1 ] && [ "$in_progress" = 0 ]; then
              echo "master 上同一 commit 的 check 失败，停止发布" >&2
              exit 1
            fi
            sleep 15
          done
          echo "等待超时：master 上没有通过的 check" >&2
          exit 1

  build:
    needs: await-master-check
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: read
    container:
      image: ghcr.io/hadyliu/cross-systemconnect-toolchain:latest
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - name: 与本地脚本一致的 /src 路径
        run: rm -rf /src && ln -s "$GITHUB_WORKSPACE" /src

      - uses: actions/cache@v4
        with:
          path: |
            /usr/local/cargo/registry
            /usr/local/cargo/git
            target
          key: build-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: build-${{ runner.os }}-

      - name: 编译 Linux 与 Windows（x86_64-pc-windows-gnu）
        run: bash packaging/compile.sh

      - name: SHA256SUMS
        run: |
          cd dist
          sha256sum Cross-SystemConnect-linux-x86_64.tar.gz Cross-SystemConnect-windows-x86_64.zip > SHA256SUMS

      - uses: actions/upload-artifact@v4
        with:
          name: cross-systemconnect-${{ github.ref_name }}
          path: |
            dist/Cross-SystemConnect-linux-x86_64.tar.gz
            dist/Cross-SystemConnect-windows-x86_64.zip
            dist/SHA256SUMS

      - name: 发布 Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          draft: false
          generate_release_notes: true
          files: |
            dist/Cross-SystemConnect-linux-x86_64.tar.gz
            dist/Cross-SystemConnect-windows-x86_64.zip
            dist/SHA256SUMS
