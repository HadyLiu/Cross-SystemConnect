# 手动构建工具链镜像。ci.yml 不调用本工作流。
# packaging/Dockerfile → ghcr.io/<owner>/<repo>-toolchain:toolchain-<哈希>（小写），并覆盖 :latest。
# 哈希 = packaging/Dockerfile 内容 sha256 前 12 位。该标签已存在则跳过，除非勾选 force。
# ci.yml 的 check / build 固定使用 :latest，所以构建完成后下一次 CI 才会用到新镜像。
name: toolchain-image

on:
  workflow_dispatch:
    inputs:
      force:
        description: 强制重建当前哈希标签（并覆盖 :latest）
        type: boolean
        default: false

permissions:
  contents: read
  packages: write

concurrency:
  group: toolchain-image-${{ github.ref }}
  cancel-in-progress: false

jobs:
  image:
    runs-on: ubuntu-latest
    outputs:
      name: ${{ steps.img.outputs.name }}
    steps:
      - uses: actions/checkout@v4

      - name: 镜像名（小写，按 Dockerfile 哈希）
        id: img
        run: |
          hash=$(sha256sum packaging/Dockerfile | cut -c1-12)
          repo="ghcr.io/${GITHUB_REPOSITORY,,}-toolchain"
          echo "name=${repo}:toolchain-${hash}" >> "$GITHUB_OUTPUT"
          echo "latest=${repo}:latest" >> "$GITHUB_OUTPUT"

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 判断镜像是否已存在
        id: exists
        env:
          IMAGE: ${{ steps.img.outputs.name }}
          FORCE: ${{ inputs.force }}
        run: |
          if [ "$FORCE" = "true" ]; then
            echo "强制重建"; echo "build=true" >> "$GITHUB_OUTPUT"
          elif docker manifest inspect "$IMAGE" > /dev/null 2>&1; then
            echo "镜像已存在，跳过构建"; echo "build=false" >> "$GITHUB_OUTPUT"
          else
            echo "镜像不存在，开始构建"; echo "build=true" >> "$GITHUB_OUTPUT"
          fi

      - if: steps.exists.outputs.build == 'true'
        uses: docker/setup-buildx-action@v3

      - if: steps.exists.outputs.build == 'true'
        uses: docker/build-push-action@v6
        with:
          context: packaging
          file: packaging/Dockerfile
          push: true
          tags: |
            ${{ steps.img.outputs.name }}
            ${{ steps.img.outputs.latest }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
