[workspace]
resolver = "2"
members = [
    "crates/csc-proto",
    "crates/csc-config",
    "crates/csc-platform",
    "crates/csc-core",
    "crates/csc-ui",
]
default-members = ["crates/csc-core", "crates/csc-ui"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
authors = ["Cross-SystemConnect"]

[workspace.dependencies]
anyhow = "1"
bytes = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = [
    "rt-multi-thread",
    "macros",
    "sync",
    "time",
    "net",
    "io-util",
    "fs",
    "process",
    "signal",
] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-appender = "0.2"
dirs = "6"
hostname = "0.4"
xxhash-rust = { version = "0.8", features = ["xxh64"] }
# ring, not aws-lc: the Windows GNU toolchain has no cmake/clang for aws-lc.
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12", "logging"] }
rcgen = { version = "0.13", default-features = false, features = ["pem", "ring"] }
sha2 = "0.10"
csc-proto = { path = "crates/csc-proto" }
csc-config = { path = "crates/csc-config" }
csc-platform = { path = "crates/csc-platform" }

# Dev: faster rebuilds. Release: avoid thin LTO (very slow on gnu + windows crates).
[profile.dev]
incremental = true
debug = 1

[profile.release]
codegen-units = 16
lto = false
incremental = false
