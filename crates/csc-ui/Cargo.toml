[package]
name = "csc-ui"
version.workspace = true
edition.workspace = true

[[bin]]
name = "Cross-SystemConnect"
path = "src/main.rs"

[dependencies]
anyhow.workspace = true
csc-proto.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "sync", "time", "net", "io-util", "process"] }
tracing.workspace = true
tracing-subscriber.workspace = true
dirs.workspace = true

tao = "0.30"
wry = { version = "0.47", features = ["linux-body"] }
tray-icon = "0.19"
open = "5"
image = { version = "0.25", default-features = false, features = ["png"] }
