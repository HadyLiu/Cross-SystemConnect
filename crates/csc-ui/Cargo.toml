[package]
name = "csc-ui"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "Cross-SystemConnect"
path = "src/main.rs"

[dependencies]
anyhow.workspace = true
csc-config.workspace = true
csc-proto.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "sync", "time", "net", "io-util", "process"] }
tracing.workspace = true
tracing-subscriber.workspace = true
dirs.workspace = true
# glow：Windows mingw 交叉编译时默认 wgpu/DX12 编不过
eframe = { version = "0.36.2", default-features = false, features = [
    "accesskit",
    "default_fonts",
    "glow",
    "links",
    "wayland",
    "x11",
] }
rfd = "0.17"
image = { version = "0.25", default-features = false, features = ["png"] }
open = "5"

[target.'cfg(not(target_os = "linux"))'.dependencies]
tray-icon = "0.19"

[target.'cfg(target_os = "linux")'.dependencies]
ksni = "0.2"
libc = "0.2"

[target.'cfg(windows)'.dependencies]
csc-core = { path = "../csc-core" }
