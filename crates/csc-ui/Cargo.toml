[package]
name = "csc-ui"
version.workspace = true
edition.workspace = true

[[bin]]
name = "Cross-SystemConnect"
path = "src/main.rs"

[dependencies]
anyhow.workspace = true
csc-config.workspace = true
csc-proto.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "sync", "time", "net", "io-util", "process"] }
tracing.workspace = true
tracing-subscriber.workspace = true
dirs.workspace = true

tao = "0.30"
wry = { version = "0.47", features = ["linux-body"] }
open = "5"
image = { version = "0.25", default-features = false, features = ["png"] }

[target.'cfg(not(target_os = "linux"))'.dependencies]
tray-icon = "0.19"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.58", features = ["Win32_Foundation", "Win32_System_Com", "Win32_UI_Shell", "Win32_UI_Shell_Common"] }

[target.'cfg(target_os = "linux")'.dependencies]
ksni = "0.2"
gtk = "0.18"
