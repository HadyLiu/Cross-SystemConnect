# License, source, and advisory checks for `cargo deny check`.
# Run inside the toolchain image: bash scripts/check-docker.sh

[graph]
targets = [
    "x86_64-unknown-linux-gnu",
    "x86_64-pc-windows-gnu",
]

[advisories]
# cargo-deny 0.18+ 新格式：vulnerability/notice 键已移除，漏洞一律报错；
# unmaintained 表示作用范围（all/workspace/transitive/none），范围内即报错。
# 设为 none：不因无人维护的依赖失败（原意图为仅警告，cargo audit 仍会提示）。
unmaintained = "none"
yanked = "warn"

[licenses]
version = 2
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "CC0-1.0",
    "ISC",
    "MIT",
    "MPL-2.0",
    "OpenSSL",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    # ksni（csc-ui 的 Linux 托盘依赖）使用 Unlicense（公共领域），与 Apache-2.0 兼容
    "Unlicense",
    "Zlib",
]
confidence-threshold = 0.8

[bans]
multiple-versions = "warn"
wildcards = "allow"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
